<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Environment diagram: three Proxmox nodes, a NAS and the personal workstation outside the lab." style="width:100%;height:auto">
<rect width="1000" height="640" fill="#0F1B2D"/>
